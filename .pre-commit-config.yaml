# Local pre-commit hooks mirroring the blocking CI lint job.
# Install/activate with:  pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Blocking rule set; keep identical to scripts/lint and tests/test_lint_ratchet.py.
      - id: ruff
        args: [--select, "F,E9,PLE,B,T20,S307,ASYNC,RUF006,F401,G004,ERA001,B006,BLE001,TRY400,ARG", --fix]
      - id: ruff-format
