[pytest]
# Collect both the integration tests and the vendored pyloxone_api tests.
testpaths = tests custom_components/loxone/pyloxone_api/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `online` tests require a reachable Miniserver and are excluded by default.
# Coverage is scoped to the vendored wire protocol: the pure-unit contract and
# message-parsing tests exercise that layer; the platform modules have no
# runnable standalone tests yet and are pulled in by the Phase-1 HA-harness
# tree. TODO(WP-1): as the HA-harness tests land, widen to
# `--cov=custom_components/loxone` and consider raising the floor again.
addopts =
    -m "not online"
    --cov=custom_components/loxone/pyloxone_api
    --cov-report=term-missing
    --cov-fail-under=20

# asyncio_mode = auto so bare `async def test_*` functions run without needing
# an explicit `@pytest.mark.asyncio` on every test.
asyncio_mode = auto

markers =
    online: requires a reachable Miniserver (deselected by default)
