[pytest]
# All tests live under tests/ (nothing under custom_components/ is a test).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `online` tests require a reachable Miniserver and are excluded by default.
# Coverage measures the whole integration (the earlier pyloxone_api-only scope
# hid the platform modules). The floor is a ratchet (75 -> 85 once P1/P2 landed at 88.7%): raise it as gaps close,
# never lower it. Whole-integration coverage was 79.7% when it was widened.
addopts =
    -m "not online"
    --cov=custom_components/loxone
    --cov-report=term-missing:skip-covered
    --cov-fail-under=85

# asyncio_mode = auto so bare `async def test_*` functions run without needing
# an explicit `@pytest.mark.asyncio` on every test.
asyncio_mode = auto

markers =
    online: requires a reachable Miniserver (deselected by default)
