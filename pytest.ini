[pytest]
# Collect both the integration tests and the vendored pyloxone_api tests.
testpaths = tests custom_components/loxone/pyloxone_api/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `online` tests require a reachable Miniserver and are excluded by default.
# Coverage is scoped to the vendored wire protocol: that is the only layer the
# pure-unit test tree exercises today (the platform modules have no runnable
# standalone tests yet and would sit at 0%, dragging the total below the floor).
# TODO(WP-0.2): once the HA-harness fixtures land and pull the platform modules
# into the test run, widen this back to `--cov=custom_components/loxone`.
addopts =
    -m "not online"
    --cov=custom_components/loxone/pyloxone_api
    --cov-report=term-missing
    --cov-fail-under=15

# asyncio_mode = auto so bare `async def test_*` functions run without needing
# an explicit `@pytest.mark.asyncio` on every test.
asyncio_mode = auto

markers =
    online: requires a reachable Miniserver (deselected by default)
