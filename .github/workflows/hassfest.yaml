name: Validate with hassfest

# Push and pull_request are covered by the `hassfest` job in ci.yaml; this
# workflow keeps only the nightly cron, which catches breakage originating
# outside the repository (a new Home Assistant release changing hassfest).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: home-assistant/actions/hassfest@master
