name: Validate

# Push and pull_request are covered by the `hacs` job in ci.yaml; this workflow
# keeps only the nightly cron, which catches breakage originating outside the
# repository (HACS or Home Assistant changing their requirements).
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - name: HACS validation
        uses: "hacs/action@22.5.0"
        with:
          category: "integration"
