name: Close inactive issues
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

# A small project cannot reproduce every hardware report quickly, so issues
# only go stale after six months of silence and close a month after that.
jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 180
          days-before-issue-close: 30
          stale-issue-label: "stale"
          stale-issue-message: "This issue has had no activity for 180 days and is marked stale. Comment if it is still relevant and it will stay open."
          close-issue-message: "Closed after 30 days without activity since being marked stale. Reopen or file a new issue if the problem persists."
          days-before-pr-stale: -1
          days-before-pr-close: -1
          repo-token: ${{ secrets.GITHUB_TOKEN }}
