name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Only run the tag-only `manifest-version` job on tag push; the rest still run
  # on push/pull_request above.
  # (GitHub: a tag push matches both `push` and the tag filter.)

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  # ---------------------------------------------------------------------------
  # Lint: the defect subset is BLOCKING; the full `ALL` pass is advisory.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.15.20

      # Blocking: seven rule families that catch genuine bugs, not style noise.
      - name: ruff check (defect subset, blocking)
        run: ruff check . --select F,E9,PLE,B,T20,S307,ASYNC,RUF006

      # Advisory: the full `ruff.toml` (`select = ALL`) pass. Not blocking until
      # the WP-5.3 lint ratchet has worked its way through the backlog.
      - name: ruff check (full, advisory)
        continue-on-error: true
        run: ruff check . --statistics

      - name: ruff format check
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Test: Python 3.14 only (Home Assistant 2026.8.1 refuses < 3.14.2).
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # `-m "not online"` (set in pytest.ini) deselects tests that need a Miniserver.
      - name: Run tests
        run: pytest -q

  # ---------------------------------------------------------------------------
  # hassfest: validate manifest/config_flow against the Home Assistant schema.
  # ---------------------------------------------------------------------------
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  # ---------------------------------------------------------------------------
  # hacs: HACS marketplace validation (pinned, no floating @main).
  # ---------------------------------------------------------------------------
  hacs:
    runs-on: ubuntu-latest
    # Two of the nine HACS checks — "topics" and "issues" — inspect the GitHub
    # repository itself, not the code, and no commit can satisfy them on a fork
    # (forks start with no topics and issues disabled). Report them everywhere,
    # but only let them block the canonical repository.
    continue-on-error: ${{ github.repository != 'JoDehli/PyLoxone' }}
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: "integration"

  # ---------------------------------------------------------------------------
  # translations: en.json must be a superset of de.json (no missing keys).
  # ---------------------------------------------------------------------------
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          python - <<'PY'
          import json
          en = json.load(open("custom_components/loxone/translations/en.json"))
          de = json.load(open("custom_components/loxone/translations/de.json"))

          missing = []
          def walk(a, b, path=""):
              for k, v in a.items():
                  p = f"{path}.{k}" if path else k
                  if k not in b:
                      missing.append(p)
                  elif isinstance(v, dict) and isinstance(b[k], dict):
                      walk(v, b[k], p)
          walk(en, de)

          if missing:
              print("de.json is missing keys present in en.json:")
              for m in missing:
                  print(f"  - {m}")
              raise SystemExit(1)
          print("translation keys OK")
          PY

  # ---------------------------------------------------------------------------
  # manifest-version: only on tag push — manifest.json version must equal the tag.
  # ---------------------------------------------------------------------------
  manifest-version:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check manifest version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          MANIFEST="$(python -c 'import json;print(json.load(open("custom_components/loxone/manifest.json"))["version"])')"
          echo "tag=${TAG} manifest=${MANIFEST}"
          test "${TAG}" = "${MANIFEST}"
